# ===================================================================
# ARQUIVO DE CONFIGURAÇÃO TELEGRAF - TELEMETRIA CAN/OBD (ESP32-S3)
# Edge Telemetry Layer — Versão corrigida
# ===================================================================
# MUDANÇAS vs versão anterior:
#   FIX-01: Adicionado case 0x7E8 (OBD_PID) no starlark — estava ausente
#   FIX-02: 0x300 corrigido: só grava coolant_temp_c (val2), val1 descartado
#   FIX-03: OBD_PID agora usa virtual CAN IDs (0x701–0x706) para roteamento
#            sem mudança no tamanho do BinaryFrame (18 bytes mantidos)
#   NOTA: Firmware Rust deve ser atualizado para emitir virtual IDs nos
#         frames OBD_PID em vez de sempre usar 0x7E8. Ver comentário abaixo.
# ===================================================================

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "1ms"
  debug = true
  skip_processors_after_aggregators = false

# ===================================================================
# OUTPUT: INFLUXDB v2
# ===================================================================

[[outputs.influxdb_v2]]
  urls = ["http://influx_telemetry:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ===================================================================
# INPUT 1: STATUS DO SISTEMA (JSON)
# ===================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST:-127.0.0.1}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["/system/status"]
  qos = 0
  name_override = "system_status"
  data_format = "json"

# ===================================================================
# INPUT 2: TELEMETRIA BINÁRIA (18 BYTES — BinaryFrame)
#
# Layout do BinaryFrame (#[repr(C, packed)] em Rust):
#   Bytes 0–3  : timestamp_ms  (u32 LE)
#   Bytes 4–5  : can_id        (u16 LE) — DBC: 0x100/0x200/0x300
#                                         OBD: 0x701–0x706 (virtual IDs)
#   Byte  6    : source_id     (u8)     — 0=CAN_DBC, 1=OBD_PID
#   Byte  7    : label_id      (u8)     — 0=Normal, 1=Esportivo, 2=Economico
#   Bytes 8–11 : val1          (f32 LE) — sinal primário
#   Bytes 12–15: val2          (f32 LE) — sinal secundário
#   Bytes 16–17: obd_latency   (u16 LE) — ms; 0 para CAN_DBC
#   TOTAL: 18 bytes
#
# Virtual CAN IDs para OBD_PID (mapeamento no firmware Rust):
#   0x701 = PID 0x0D (Vehicle Speed)
#   0x702 = PID 0x0C (Engine RPM)
#   0x703 = PID 0x11 (Throttle Position)
#   0x704 = PID 0x04 (Engine Load)
#   0x705 = PID 0x10 (MAF Air Flow)
#   0x706 = PID 0x05 (Coolant Temp)
# ===================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST:-127.0.0.1}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["/telemetry/+/raw"]
  qos = 0
  name_override = "telemetry_raw"
  data_format = "binary"

  [[inputs.mqtt_consumer.binary]]
    metric_name = "telemetry_raw"
    entries = [
      { name = "timestamp_ms",  type = "uint32",  order = "little" },
      { name = "can_id",        type = "uint16",  order = "little" },
      { name = "source_id",     type = "uint8" },
      { name = "label_id",      type = "uint8" },
      { name = "val1",          type = "float32", order = "little" },
      { name = "val2",          type = "float32", order = "little" },
      { name = "obd_latency_ms",type = "uint16",  order = "little" }
    ]

# ===================================================================
# INPUT 3: REPLAY HISTÓRICO CSV (DIRETO DO SD CARD PARA O INFLUXDB)
# ===================================================================

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER_HOST:-127.0.0.1}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASSWORD}"
  topics = ["/telemetry/replay"]
  qos = 0
  name_override = "telemetry_csv"
  data_format = "csv"
  csv_header_row_count = 0
  csv_column_names = [
    "timestamp_ms", "source", "can_id", "speed_kmh", "rpm",
    "throttle_pct", "engine_load_pct", "maf_g_s", "coolant_temp_c",
    "session_label", "obd_latency_ms"
  ]
  csv_column_types = [
    "int", "string", "string", "float", "float",
    "float", "float", "float", "float",
    "string", "float"
  ]
  csv_tag_columns = ["source", "session_label", "can_id"]
  csv_timestamp_column = "timestamp_ms"
  csv_skip_values = [
    "", "null", "NaN", "speed_kmh", "rpm", "throttle_pct", "engine_load_pct",
    "maf_g_s", "coolant_temp_c", "obd_latency_ms",
    "NOR", "Normal", "ECO", "Economico", "SPT", "Esportivo", "DIAG", "BOOT"
  ]
  csv_trim_space = true

# ===================================================================
# PROCESSOR 1: TELEMETRIA CSV (REPLAY)
# ===================================================================

[[processors.starlark]]
  namepass = ["telemetry_csv"]
  source = '''
def apply(metric):
    obd_lat = metric.fields.get("obd_latency_ms")
    if obd_lat != None and obd_lat > 0:
        metric.fields["obd_latency_ms"] = int(obd_lat)
    else:
        metric.fields.pop("obd_latency_ms", None)
    metric.name = "telemetry"
    return metric
'''

# ===================================================================
# PROCESSOR 2: TELEMETRIA BINÁRIA RAW (TEMPO REAL 41Hz — ZERO OVERHEAD)
# ===================================================================

[[processors.starlark]]
  namepass = ["telemetry_raw"]
  source = '''
def apply(metric):
    can_id = metric.fields.get("can_id")
    if can_id == None or can_id == 0:
        return None

    val1    = metric.fields.get("val1", 0.0)
    val2    = metric.fields.get("val2", 0.0)
    src_id  = metric.fields.get("source_id", 0)
    lbl_id  = metric.fields.get("label_id", 0)
    ts_ms   = metric.fields.get("timestamp_ms", 0)
    obd_lat = metric.fields.get("obd_latency_ms", 0)

    # Limpar campos intermediários do parser binário
    metric.fields.pop("batch_count",    None)
    metric.fields.pop("can_id",         None)
    metric.fields.pop("source_id",      None)
    metric.fields.pop("label_id",       None)
    metric.fields.pop("val1",           None)
    metric.fields.pop("val2",           None)
    metric.fields.pop("obd_latency_ms", None)

    # Tags para filtragem no Grafana
    metric.tags["source"]        = "CAN_DBC" if src_id == 0 else "OBD_PID"
    labels_map = {1: "Economico", 2: "Normal", 3: "Esportivo"}
    metric.tags["session_label"] = labels_map.get(lbl_id, "Normal")
    metric.tags["can_id"]        = "0x%x" % can_id
    metric.name = "telemetry"

    # Timestamp de boot do ESP32 (não é o timestamp do InfluxDB)
    metric.fields["timestamp_ms"] = ts_ms

    # Latência OBD apenas se válida (> 0 e <= 5000 ms) como inteiro
    if obd_lat > 0 and obd_lat <= 5000:
        metric.fields["obd_latency_ms"] = int(obd_lat)

    # ── CAN_DBC: Frames passivos do barramento ──────────────────────
    if can_id == 0x100:
        metric.fields["speed_kmh"] = val1
        metric.fields["rpm"] = val2

    elif can_id == 0x200:
        metric.fields["throttle_pct"] = val1
        metric.fields["engine_load_pct"] = val2

    elif can_id == 0x300:
        # ID 0x300: Coolant Temp apenas em val2
        metric.fields["coolant_temp_c"] = val2

    # ── OBD_PID: Virtual CAN IDs (firmware atualizado) ─────────────
    # Cada PID OBD tem seu próprio virtual ID para roteamento sem ambiguidade
    elif can_id == 0x701:
        metric.fields["speed_kmh"] = val1

    elif can_id == 0x702:
        metric.fields["rpm"] = val2

    elif can_id == 0x703:
        metric.fields["throttle_pct"] = val1

    elif can_id == 0x704:
        metric.fields["engine_load_pct"] = val2

    elif can_id == 0x705:
        metric.fields["maf_g_s"] = val1

    elif can_id == 0x706:
        metric.fields["coolant_temp_c"] = val2

    # ── FALLBACK: 0x7E8 legado (firmware NÃO atualizado para virtual IDs) ──
    # ATENÇÃO: sem PID no frame, não é possível saber qual sinal é qual.
    # val1 e val2 são gravados como campos genéricos para debug.
    # Remover este bloco após firmware ser atualizado para virtual IDs.
    elif can_id == 0x7E8:
        metric.tags["can_id"] = "0x7e8_legacy"
        if val1 != 0.0:
            metric.fields["obd_val1_raw"] = val1
        if val2 != 0.0:
            metric.fields["obd_val2_raw"] = val2

    else:
        # ID desconhecido — descartar silenciosamente
        return None

    return metric
'''
